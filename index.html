<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Zenova — One agency for everything modern</title>
    <link rel="icon" type="image/png" href="./assets/zenova-logo.png" />
    <meta name="description" content="Zenova combines design, development, marketing, and startup support into one seamless partnership for ambitious modern businesses." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <script>
      // Set initial theme synchronously, before paint, to avoid first-frame flash.
      try {
        const stored = localStorage.getItem('zenova.theme');
        document.documentElement.setAttribute('data-theme', stored === 'light' ? 'light' : 'dark');
      } catch (_) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
